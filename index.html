<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Win Gems</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #00a884; /* Wahi Teal color jo image mein hai */
            overflow: hidden;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #00a884;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 10000;
        }

        .splash-content { text-align: center; color: white; }
        
        /* Character Image Placeholder (Aapke logo ke liye) */
        .splash-logo {
            width: 250px; height: auto; margin-bottom: 30px;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.3));
        }

        .splash-text {
            font-size: 20px; font-weight: bold; margin-bottom: 40px;
            letter-spacing: 1px; text-shadow: 1px 1px 5px rgba(0,0,0,0.2);
        }

        /* Loading Bar */
        .loader-container {
            width: 200px; height: 6px; background: rgba(255,255,255,0.2);
            border-radius: 10px; overflow: hidden; position: relative;
        }
        .loader-bar {
            width: 0%; height: 100%; background: #f9a825; /* Gold color */
            border-radius: 10px; animation: load 3s ease-in-out forwards;
        }

        @keyframes load {
            0% { width: 0%; } 100% { width: 100%; }
        }

        /* Main Website (Load hone ke baad) */
        #main-site { display: none; background: #001529; min-height: 100vh; color: white; }
        .header { background: #00a884; padding: 15px; text-align: center; font-weight: bold; font-size: 22px; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-content">
            <img src="https://i.ibb.co/LdpXmX3/fantasy-gems-splash.png" class="splash-logo" alt="Lucky Win Gems">
            
            <p class="splash-text">Withdraw fast, safe and stable</p>
            
            <div class="loader-container">
                <div class="loader-bar"></div>
            </div>
            
            <p style="margin-top: 15px; font-size: 14px; opacity: 0.8;">Lucky Win Gems - Loading...</p>
        </div>
    </div>

    <div id="main-site">
        <div class="header">Lucky Win Gems</div>
        <div style="padding: 50px; text-align: center;">
            <h2>Welcome to Lucky Win Gems</h2>
            <p>Aapki pro website ab tayyar ho rahi hai...</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            setTimeout(function() {
                document.getElementById('splash-screen').style.opacity = '0';
                document.getElementById('splash-screen').style.transition = '0.5s';
                setTimeout(function() {
                    document.getElementById('splash-screen').style.display = 'none';
                    document.getElementById('main-site').style.display = 'block';
                    document.body.style.overflow = 'auto';
                }, 500);
            }, 3500); // 3.5 seconds loading
        };
    </script>
</body>
</html>

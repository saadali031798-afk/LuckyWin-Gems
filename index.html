<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Win Gems</title>
    <style>
        body { font-family: Arial, sans-serif; background: #001529; color: white; text-align: center; margin: 0; padding: 20px; }
        .header { background: #002140; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .balance-box { background: linear-gradient(45deg, #00bfa5, #00796b); padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .btn-container { display: flex; justify-content: space-around; margin-bottom: 30px; }
        .btn { padding: 15px 30px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; width: 40%; }
        .deposit { background: #ffc107; color: black; }
        .withdraw { background: #f44336; color: white; }
        .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .game-card { background: #002140; padding: 20px; border-radius: 10px; border: 1px solid #003a70; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Lucky Win Gems</h1>
    </div>

    <div class="balance-box">
        <p>Current Balance</p>
        <h2>Rs 0.00</h2>
    </div>

    <div class="btn-container">
        <button class="btn deposit">DEPOSIT</button>
        <button class="btn withdraw">WITHDRAW</button>
    </div>

    <h3>Popular Games</h3>
    <div class="game-grid">
        <div class="game-card">Fortune Gems</div>
        <div class="game-card">Aviator</div>
        <div class="game-card">Chicken Road</div>
        <div class="game-card">Wingo</div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Gems - Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #000; color: white; font-family: 'sans-serif'; overflow-x: hidden; }
        .aviator-screen { background: #1b0505; border-radius: 15px; position: relative; height: 300px; overflow: hidden; border: 2px solid #3d0a0a; }
        #graph-canvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }
        #plane-img { position: absolute; bottom: 20px; left: 20px; width: 50px; z-index: 10; transition: transform 0.1s linear; }
        .bet-box { background: #2c2d30; border-radius: 20px; padding: 15px; }
        .btn-bet { background: #28a745; color: white; font-weight: 900; border-radius: 12px; height: 60px; font-size: 20px; box-shadow: 0 4px #1e7e34; }
        .btn-bet:active { transform: translateY(2px); box-shadow: 0 2px #1e7e34; }
        .btn-cashout { background: #ffc107; color: black !important; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; padding: 20px; align-items: center; justify-content: center; }
        .deposit-card { background: #1c1c1e; border-radius: 25px; width: 100%; max-width: 400px; padding: 25px; border: 1px solid #333; }
    </style>
</head>
<body>

    <header class="p-4 flex justify-between items-center border-b border-gray-800">
        <div class="text-red-600 font-black italic text-xl">AVIATOR</div>
        <div class="flex items-center gap-3">
            <div class="bg-[#1c1c1e] px-4 py-1.5 rounded-full border border-gray-700">
                <span class="text-green-500 font-bold text-sm">Rs </span>
                <span id="bal" class="font-black text-sm">0.00</span>
            </div>
            <button onclick="openDeposit()" class="bg-green-600 text-white px-4 py-1.5 rounded-lg text-xs font-black uppercase">Deposit</button>
        </div>
    </header>

    <div class="p-4">
        <div class="aviator-screen mb-4">
            <div id="multi-display" class="absolute inset-0 flex items-center justify-center text-6xl font-black text-white z-20">1.00x</div>
            <canvas id="graph-canvas"></canvas>
            <img id="plane-img" src="https://i.ibb.co/6P2T3yV/aviator-new.png" alt="plane">
        </div>

        <div class="grid grid-cols-1 gap-4">
            <div class="bet-box">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex gap-2">
                        <button class="bg-black px-3 py-1 rounded-full text-xs font-bold border border-gray-700">Bet</button>
                        <button class="text-gray-500 px-3 py-1 text-xs font-bold">Auto</button>
                    </div>
                </div>
                <div class="flex gap-2 items-center">
                    <div class="flex-1 bg-black rounded-xl p-2 border border-gray-800 text-center">
                        <p class="text-[10px] text-gray-500 font-bold">Amount</p>
                        <input id="betAmount" type="number" value="100" class="bg-transparent text-center font-black text-xl w-full outline-none">
                    </div>
                    <button id="mainBtn" onclick="placeBet()" class="flex-1 btn-bet">BET</button>
                </div>
            </div>
        </div>
    </div>

    <div id="depositModal" class="modal">
        <div class="deposit-card">
            <h2 class="text-center font-black text-xl mb-6 text-green-500 uppercase tracking-tighter">Fast Deposit</h2>
            
            <div class="bg-black p-4 rounded-2xl border border-gray-800 mb-6">
                <p class="text-[10px] text-gray-500 font-bold mb-2">SEND PAYMENT TO:</p>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-gray-400 text-sm">Account:</span>
                    <span class="font-black text-white">Easypaisa</span>
                </div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-gray-400 text-sm">Number:</span>
                    <span class="font-black text-cyan-400 text-lg">03179774144</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-400 text-sm">Name:</span>
                    <span class="font-black text-white uppercase">Saad Ali</span>
                </div>
            </div>

            <div class="space-y-4">
                <input type="text" placeholder="Your Account Name" class="w-full bg-black border border-gray-800 p-4 rounded-xl text-sm">
                <input type="text" placeholder="Transaction ID (TID)" class="w-full bg-black border border-gray-800 p-4 rounded-xl text-sm">
                <button onclick="submitDep()" class="w-full bg-green-600 py-4 rounded-2xl font-black text-lg">SUBMIT PAYMENT</button>
                <button onclick="closeDeposit()" class="w-full text-gray-500 font-bold text-sm">Back to Game</button>
            </div>
        </div>
    </div>

    <script>
        let balance = 0;
        let isFlying = false;
        let multiplier = 1.0;
        let betPlaced = false;

        function openDeposit() { document.getElementById('depositModal').style.display = 'flex'; }
        function closeDeposit() { document.getElementById('depositModal').style.display = 'none'; }

        function submitDep() {
            alert("Payment Request Sent! Your balance will update after verification (10-30 mins).");
            closeDeposit();
        }

        // Aviator Logic
        function placeBet() {
            let amount = parseFloat(document.getElementById('betAmount').value);
            if(balance < amount) {
                alert("Low Balance! Please Deposit.");
                openDeposit();
                return;
            }

            if(!isFlying) {
                balance -= amount;
                updateUI();
                startFlight();
            } else {
                cashOut();
            }
        }

        function startFlight() {
            isFlying = true;
            multiplier = 1.0;
            let btn = document.getElementById('mainBtn');
            let mDisplay = document.getElementById('multi-display');
            let plane = document.getElementById('plane-img');
            
            btn.innerText = "CASH OUT";
            btn.classList.add('btn-cashout');

            let crashPoint = (Math.random() * 3 + 1.1).toFixed(2);
            
            let interval = setInterval(() => {
                multiplier += 0.02;
                mDisplay.innerText = multiplier.toFixed(2) + "x";
                
                // Plane movement
                let x = (multiplier - 1) * 40;
                let y = (multiplier - 1) * 30;
                plane.style.transform = `translate(${x}px, -${y}px)`;

                if(multiplier >= crashPoint) {
                    clearInterval(interval);
                    isFlying = false;
                    mDisplay.innerHTML = `<span class="text-red-600">FLEW AWAY!</span>`;
                    btn.innerText = "BET";
                    btn.classList.remove('btn-cashout');
                }
            }, 100);

            window.currentInterval = interval;
        }

        function cashOut() {
            if(!isFlying) return;
            clearInterval(window.currentInterval);
            let win = parseFloat(document.getElementById('betAmount').value) * multiplier;
            balance += win;
            updateUI();
            isFlying = false;
            document.getElementById('multi-display').innerHTML = `<span class="text-green-500">Rs ${win.toFixed(2)}</span>`;
            let btn = document.getElementById('mainBtn');
            btn.innerText = "BET";
            btn.classList.remove('btn-cashout');
        }

        function updateUI() {
            document.getElementById('bal').innerText = balance.toFixed(2);
        }
    </script>
</body>
</html>

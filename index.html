<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Gems - Admin Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #010409; color: white; font-family: sans-serif; }
        .btn-gold { background: linear-gradient(90deg, #ffc107, #ff9800); color: black; font-weight: 900; }
        .aviator-bg { background: #1b0505; height: 250px; border-radius: 20px; position: relative; overflow: hidden; border: 1px solid #3d0a0a; }
        #plane { position: absolute; bottom: 20px; left: 20px; width: 45px; z-index: 10; }
    </style>
</head>
<body>

    <header class="p-4 flex justify-between items-center border-b border-gray-900">
        <h1 id="adminLogo" onclick="adminTouch()" class="text-xl font-black italic text-cyan-400 cursor-pointer">FANTASY GEMS</h1>
        <div class="bg-black px-4 py-1 rounded-full border border-gray-700">
            <span class="text-green-500 font-bold">Rs </span><span id="balDisplay" class="font-black">0.00</span>
        </div>
    </header>

    <div class="p-4">
        <div class="aviator-bg mb-4 flex items-center justify-center">
            <div id="multiText" class="text-6xl font-black italic">1.00x</div>
            <img id="plane" src="https://i.ibb.co/6P2T3yV/aviator-new.png">
        </div>
        
        <div class="bg-[#2c2d30] p-4 rounded-3xl">
            <input type="number" id="betAmount" value="100" class="w-full bg-black border border-gray-800 p-4 rounded-xl text-center font-black text-xl mb-4">
            <button id="betBtn" onclick="startAviator()" class="w-full btn-gold py-4 rounded-2xl font-black text-xl">BET</button>
        </div>

        <button onclick="document.getElementById('depModal').style.display='block'" class="w-full mt-4 bg-blue-600 py-3 rounded-xl font-bold">RECHARGE (Muhammed Talha)</button>
    </div>

    <div id="depModal" class="fixed inset-0 bg-black/95 z-50 p-6 hidden">
        <h2 class="text-center font-black text-xl mb-6">DEPOSIT TO TALHA</h2>
        <div class="bg-[#161b22] p-5 rounded-2xl mb-6 border border-gray-800">
            <p class="text-xs text-gray-500 font-bold">ACCOUNT NAME: MUHAMMED TALHA</p>
            <p class="text-2xl font-black text-cyan-400">03179774144</p>
        </div>
        <input type="text" id="tid" placeholder="Enter Transaction ID" class="w-full bg-[#0d1117] border border-gray-800 p-4 rounded-xl mb-4">
        <button onclick="userSubmit()" class="w-full btn-gold py-4 rounded-xl">SUBMIT PAYMENT</button>
    </div>

    <script>
        let balance = 0;
        let clickCount = 0;

        // --- ADMIN SECRET TRICK ---
        // Logo par 5 baar click karne se paise dalne ka option aaye ga
        function adminTouch() {
            clickCount++;
            if(clickCount >= 5) {
                let password = prompt("Enter Admin Password:");
                if(password === "talha786") { // Aapka secret password
                    let amount = prompt("Kitne fake pese dalne hain?");
                    if(amount) {
                        balance += parseFloat(amount);
                        updateUI();
                        alert("Done! Rs " + amount + " added to account.");
                    }
                }
                clickCount = 0;
            }
        }

        function updateUI() {
            document.getElementById('balDisplay').innerText = balance.toFixed(2);
        }

        function userSubmit() {
            alert("Sent! Please wait 5 minutes for Muhammed Talha to verify.");
            document.getElementById('depModal').style.display = 'none';
        }

        // Aviator Logic
        function startAviator() {
            let bet = parseFloat(document.getElementById('betAmount').value);
            if(balance < bet) return alert("Pese khatam! Deposit karo.");
            
            balance -= bet; updateUI();
            let m = 1.0;
            let btn = document.getElementById('betBtn');
            btn.innerText = "CASH OUT";
            btn.style.background = "orange";

            let crash = (Math.random() * 2 + 1.1).toFixed(2);
            let fly = setInterval(() => {
                m += 0.05;
                document.getElementById('multiText').innerText = m.toFixed(2) + "x";
                if(m >= crash) {
                    clearInterval(fly);
                    document.getElementById('multiText').innerHTML = "<span class='text-red-500'>LOST!</span>";
                    btn.innerText = "BET"; btn.style.background = "";
                }
            }, 100);

            btn.onclick = () => {
                clearInterval(fly);
                balance += (bet * m);
                updateUI();
                document.getElementById('multiText').innerHTML = "<span class='text-green-500'>WIN!</span>";
                btn.innerText = "BET"; btn.style.background = "";
                btn.onclick = startAviator;
            };
        }
    </script>
</body>
</html>
